[project]
name = "ideas-mining"
version = "0.1.0"
description = "Mine forum pain points for insurance and real estate; email a weekly digest."
requires-python = ">=3.12"

dependencies = [
    "arq>=0.26",
    "asyncpraw>=7.7",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    "voyageai>=0.3",
]

# OQ-9 / FINDING-1.9 resolved. The Validator owns the test suite and recommended the
# framework; only the Builder may edit this manifest, so the recommendation is declared
# here rather than installed ad hoc. Without this, validation passed on a machine that
# happened to have pytest and could not be reproduced from a clean checkout.
#
#   pip install -e ".[test]"
[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ideas_mining"]
