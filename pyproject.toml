[project]
name = "ideas-mining"
version = "0.1.0"
description = "Mine forum pain points for insurance and real estate; email a weekly digest."
requires-python = ">=3.12"

dependencies = [
    "arq>=0.26",
    "asyncpraw>=7.7",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    "voyageai>=0.3",
]

# Test dependencies are intentionally absent. Under DADP the Validator owns the test
# suite and recommends the framework (.agent/prompts/codex_session.md: pytest +
# pytest-asyncio), but only the Builder may edit this manifest. Add them here when the
# Validator's recommendation is confirmed.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ideas_mining"]
