; Alembic config. The URL is deliberately NOT set here — migrations/env.py reads it
; from ideas_mining.config.settings, so config.py stays the only module that touches
; the environment and no credential is ever written into a checked-in file.

; version_locations is left at its default (migrations/versions), which is what keeps
; `alembic upgrade head` from ever applying anything in migrations/deferred/. Use
; alembic.deferred.ini for those, on purpose. See FINDING-2.5.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = space

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
