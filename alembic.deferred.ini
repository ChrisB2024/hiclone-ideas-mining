; Alembic config that ALSO sees migrations/deferred/ — the optional, run-them-later
; migrations. Use it deliberately, never in a deploy script:
;
;     alembic -c alembic.deferred.ini upgrade head
;
; The default alembic.ini scans only migrations/versions, so `alembic upgrade head`
; cannot apply anything in here by accident (FINDING-2.5). That separation is the whole
; mechanism — see migrations/deferred/0002_hnsw_indexes.py for why the hnsw indexes
; must not be built on an empty table.

[alembic]
script_location = migrations
prepend_sys_path = .
; Alembic 1.18 replaced version_path_separator with path_separator, and without it
; version_locations below is read as ONE path with a space in it rather than two.
path_separator = space
version_locations = migrations/versions migrations/deferred

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
