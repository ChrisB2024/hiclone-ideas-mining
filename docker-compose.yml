# Local Postgres + Redis for development and for the Validator's integration tests.
#
# OQ-2: this file is Builder-owned by the write-boundary rule (source reads it at
# runtime), but its only other consumer is the test suite, which needs a live
# pgvector database to exercise INV-2 and INV-7 at all. It is written here so the
# Validator is unblocked; if that ownership call is wrong, the fix is to move it, not
# to duplicate it.
#
# The image is pgvector/pgvector, NOT plain postgres — `CREATE EXTENSION vector` in
# migration 0001 fails on a stock image, and the error arrives at migration time rather
# than at container start.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      # Overridable from .env, which compose reads automatically (second half of
      # FINDING-2.13 — the finding named the credentials as well as the ports). The
      # defaults stay weak on purpose: this is a throwaway local database, and a
      # plausible-looking password in a committed file is worse than an obviously
      # disposable one, because it invites reuse somewhere that matters.
      #
      # If you override these, DATABASE_URL in .env has to match — nothing checks it.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ideas_mining}
    ports:
      # Bound to loopback (FINDING-2.13). A bare "5432:5432" publishes on every
      # interface, so on a cafe or office network this database — which holds scraped
      # post bodies and author names — is reachable by anyone on the LAN, behind a
      # password of "postgres". The loopback bind is what actually contains that; the
      # credentials above are defence in depth, not the fix.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Migrations and the worker both fail confusingly against a Postgres that is
      # accepting TCP but still replaying WAL, so wait for pg_isready rather than
      # for the port.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ideas_mining"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Loopback for the same reason, and Redis has no password at all.
      - "127.0.0.1:6379:6379"
    # ARQ keeps only job state here, and every pipeline stage is resumable from
    # Postgres alone — so this is deliberately not persisted. Losing Redis costs at
    # most one cron tick.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
